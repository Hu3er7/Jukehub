<style> html, body { margin:0 !important; padding:0 !important; height:100% !important; overflow:hidden !important; } </style>
<iframe id="jbFrame" style="display:block;width:100%;height:100vh;height:100dvh;border:none;"></iframe>
<script>
function setFrame() {
  document.getElementById('jbFrame').src = 'https://hu3er7.github.io/Jukehub/' + location.hash;
  // Retire "#qr=1" de l'adresse une fois transmis : un simple "Actualiser" ne compte plus comme un scan,
  // et un nouveau scan du code QR est toujours reconnu (même si l'ancien onglet est encore ouvert).
  if (location.hash === '#qr=1') history.replaceState(null, '', location.pathname + location.search);
}
setFrame();
window.addEventListener('hashchange', setFrame);

// Pont de stockage (18 oct. 2026) : garde ici, sur la page Carrd, une copie des votes et demandes du
// client. Safari efface facilement le stockage du cadre (site "tiers"), mais pas celui de cette page :
// un client qui ferme le site et rescanne le code QR retrouve donc ses votes déjà utilisés.
var JB_APP_ORIGIN = 'https://hu3er7.github.io';
window.addEventListener('message', function (e) {
  if (e.origin !== JB_APP_ORIGIN || !e.data || typeof e.data !== 'object') return;
  var d = e.data;
  try {
    if (d.type === 'jb-store-get') {
      var data = {};
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('jb_') === 0) data[k] = localStorage.getItem(k);
      }
      e.source.postMessage({ type: 'jb-store-snapshot', data: data }, JB_APP_ORIGIN);
    } else if (d.type === 'jb-store-set' && typeof d.key === 'string' && d.key.indexOf('jb_') === 0
               && typeof d.value === 'string' && d.value.length < 50000) {
      localStorage.setItem(d.key, d.value);
    }
  } catch (err) {}
});
</script>
